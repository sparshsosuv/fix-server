[default]
#Directory to store sequence number and message files.
#FileStorePath=/opt/logs/fix/server
#Directory to store logs.
#FileLogPath=/opt/logs/fix/server/log
ConnectionType=acceptor
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
ValidOrderTypes=1,2,F
UseDataDictionary=Y
DefaultMarketPrice=12.30
ValidateUserDefinedFields=N
ValidateFieldsOutOfOrder=N
PersistMessages=Y

#Storage
OdbcStoreUser=sa
OdbcStorePassword=password
OdbcStoreConnectionString=Database=mem:fixserverdb;Driver=org.hibernate.dialect.H2Dialect;Server=jdbc:h2:mem:fixserverdb

#Logging
OdbcLogUser=sa
OdbcLogPassword=password
OdbcLogConnectionString=Database=mem:fixserverdb;Driver=org.hibernate.dialect.H2Dialect;Server=jdbc:h2:mem:fixserverdb
OdbcLogIncomingTable=log_income
OdbcLogOutgoingTable=log_outgoing
OdbcLogEventTable=log_event


#CLIENT SIMULATOR SESSION
[session]
BeginString=FIX.4.4
ConnectionType=acceptor
SocketAcceptPort=9880
SenderCompID=SERVER
TargetCompID=CLIENT
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y
ValidateFieldsOutOfOrder=N
ValidateFieldsHaveValue=N
ValidateUserDefinedFields=N
DataDictionary=FIX44.xml

#WORKFLOW SESSION
[session]
BeginString=FIX.4.4
ConnectionType=acceptor
SocketAcceptPort=9870
SenderCompID=SERVER
TargetCompID=WORKFLOW
ValidateFieldsOutOfOrder=N
ValidateFieldsHaveValue=N
ValidateUserDefinedFields=N
DataDictionary=FIX44.xml


