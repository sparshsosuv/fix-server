management.endpoint.quickfixjserver.enabled=true
management.endpoints.web.exposure.include=quickfixjserver
quickfixj.server.config=${QUICKFIXJ_SERVER_CONFIG_FILE:classpath:quickfixj-server.cfg}
quickfixj.server.jmx-enabled=true
server.port=8081
api.base.url=http://localhost:8383/app/api/

spring.datasource.url=jdbc:h2:mem:fixserverdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.data.jpa.repositories.bootstrap-mode=default

# Enabling H2 Console
spring.h2.console.enabled=true

# Custom H2 Console URL
spring.h2.console.path=/h2

# Whether to enable trace output.
spring.h2.console.settings.trace=false

# Whether to enable remote access.
spring.h2.console.settings.web-allow-others=false

