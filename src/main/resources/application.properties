server.port=8081
management.endpoint.quickfixjserver.enabled=true
management.endpoints.web.exposure.include=quickfixjserver

#quickfixj acceptor
quickfixj.server.config=classpath:/fix/quickfixj-server.cfg

#quickfixj initiator
management.endpoint.quickfixjclient.enabled=true
quickfixj.client.config=classpath:/fix/quickfixj-client.cfg

#Persistence
datasource.url=jdbc:postgresql://localhost:5432/quickfix?socketTimeout=30
datasource.username=postgres
datasource.password=postgres
datasource.hibernateShowSql=true
datasource.driver=org.postgresql.Driver
datasource.hbm2ddlAuto=validate
datasource.dialect=org.hibernate.dialect.PostgreSQL9Dialect
datasource.contextual.lob.creation=true
datasource.dbcp.maxTotalConnections=100
datasource.dbcp.maxIdleConnections=30

flyway.migration.locations=ddl
flyway.migration.table=schema_history

#spring boot
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
